apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-worker
  namespace: devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-worker
  template:
    metadata:
      labels:
        app: devops-worker
    spec:
      containers:
      - name: devops-worker
        image: devops-manager:latest
        command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info"]
        envFrom:
        - configMapRef:
            name: devops-manager-config
        - secretRef:
            name: devops-manager-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
