[tool.poetry]
name = "devops-manager"
version = "0.1.0"
description = "DevOps management platform for deployments, CI/CD, and infrastructure orchestration"
authors = ["Senior DevOps Architect <architect@example.com>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
alembic = "^1.13.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
redis = "^5.0.0"
celery = {extras = ["redis"], version = "^5.3.6"}
kombu = "^5.3.5"
httpx = "^0.26.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
python-multipart = "^0.0.6"
prometheus-client = "^0.17.0"
kubernetes = "^29.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
black = "^24.1.0"
isort = "^5.13.0"
flake8 = "^6.1.0"
mypy = "^1.8.0"
httpx-mock = "^0.20.0"

[tool.poetry.scripts]
run-server = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
run-worker = "celery -A app.worker.celery_app worker --loglevel=info"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.py$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["alembic", "tests"]

[tool.pytest.ini]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
